<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlquilaYA - Mantenimiento de Flota</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        .navbar-brand { font-weight: bold; letter-spacing: 1px; }
        .text-orange { color: #ff6b00; }
        .table-custom th { background-color: #dc3545; color: white; }
    </style>
</head>
<body class="bg-light">

    <!-- Navegación -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm">
        <div class="container-fluid px-4">
            <a class="navbar-brand" href="/"><span class="text-orange">Alquila</span>YA <i class="fa-solid fa-car-side"></i></a>
            <div class="d-flex">
                <a href="/" class="btn btn-outline-light btn-sm"><i class="fa-solid fa-arrow-left"></i> Volver al Panel</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4 mb-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold text-dark"><i class="fa-solid fa-wrench text-danger"></i> Historial de Mantenimientos</h2>
            <button class="btn btn-danger shadow-sm fw-bold" data-bs-toggle="modal" data-bs-target="#modalMantenimiento" onclick="cargarVehiculos()">
                <i class="fa-solid fa-plus"></i> Ingresar a Taller
            </button>
        </div>

        <!-- Barra de búsqueda -->
        <div class="row mb-3">
            <div class="col-md-4 ms-auto">
                <div class="input-group shadow-sm">
                    <span class="input-group-text bg-white border-end-0"><i class="fa-solid fa-magnifying-glass text-muted"></i></span>
                    <input type="text" id="inputBusqueda" class="form-control border-start-0" placeholder="Buscar registro..." onkeyup="filtrarTabla()">
                </div>
            </div>
        </div>

        <div class="card shadow-sm border-0">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0 table-custom">
                        <thead>
                            <tr>
                                <th class="py-3 px-4">ID</th>
                                <th class="py-3">Vehículo</th>
                                <th class="py-3">Descripción</th>
                                <th class="py-3 text-center">Fecha / Km</th>
                                <th class="py-3 text-center">Costo</th>
                                <th class="py-3 text-center">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tablaMantenimientos">
                            <!-- Datos inyectados por JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    

    <!-- Modal para Registrar Mantenimiento -->
    <div class="modal fade" id="modalMantenimiento" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content border-0 shadow">
                <div class="modal-header bg-dark text-white">
                    <h5 class="modal-title fw-bold"><i class="fa-solid fa-screwdriver-wrench text-danger"></i> Registrar Reparación</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4">
                    <form id="formMantenimiento">
                        <div class="row g-3">
                            <div class="col-md-12">
                                <label class="form-label fw-bold">Seleccionar Vehículo</label>
                                <select id="vehiculoSelect" class="form-select" required>
                                    <option value="">Cargando vehículos...</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Fecha de Mantenimiento</label>
                                <input type="date" id="fecha" class="form-control" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Kilometraje Actual</label>
                                <div class="input-group">
                                    <input type="number" id="kilometraje" class="form-control" required>
                                    <span class="input-group-text bg-light">Km</span>
                                </div>
                            </div>
                            <div class="col-md-12">
                                <label class="form-label fw-bold">Descripción del Trabajo</label>
                                <textarea id="descripcion" class="form-control" rows="2" placeholder="Ej. Cambio de aceite, revisión de frenos..." required></textarea>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Costo de Reparación ($)</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light">$</span>
                                    <input type="number" step="0.01" id="costo" class="form-control" required>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer bg-light">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" form="formMantenimiento" class="btn btn-danger"><i class="fa-solid fa-save"></i> Enviar a Taller</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API_MANTENIMIENTOS = '/api/mantenimientos';
        const API_VEHICULOS = '/api/vehiculos';
        const modalMantenimiento = new bootstrap.Modal(document.getElementById('modalMantenimiento'));

        document.addEventListener('DOMContentLoaded', () => {
            cargarMantenimientos();
            // Evitar fechas futuras
            document.getElementById('fecha').max = new Date().toISOString().split('T')[0];
        });

        async function cargarMantenimientos() {
            try {
                const response = await fetch(API_MANTENIMIENTOS);
                const mantenimientos = await response.json();
                const tbody = document.getElementById('tablaMantenimientos');
                tbody.innerHTML = '';

                if(mantenimientos.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="6" class="text-center py-4 text-muted">No hay registros de mantenimiento en el historial.</td></tr>`;
                    return;
                }

                mantenimientos.forEach(mant => {
                    // Si el vehículo sigue en estado 'Mantenimiento', mostramos el botón verde de check
                    let btnFinalizar = mant.vehiculo.estado === 'Mantenimiento' 
                        ? `<button class="btn btn-outline-success btn-sm rounded-circle shadow-sm me-1" onclick="finalizarMantenimiento(${mant.idMantenimiento})" title="Devolver a Disponible"><i class="fa-solid fa-check"></i></button>` 
                        : '';

                    tbody.innerHTML += `
                        <tr>
                            <td class="px-4 fw-bold text-secondary">#${mant.idMantenimiento}</td>
                            <td>
                                <div class="fw-bold">${mant.vehiculo.marca} ${mant.vehiculo.modelo}</div>
                                <small class="text-muted"><i class="fa-solid fa-hashtag"></i> ${mant.vehiculo.matricula}</small>
                            </td>
                            <td>${mant.descripcion}</td>
                            <td class="text-center">
                                <div><i class="fa-regular fa-calendar text-muted"></i> ${mant.fechaMantenimiento}</div>
                                <div><span class="badge bg-secondary">${mant.kilometraje} Km</span></div>
                            </td>
                            <td class="text-center fw-bold text-danger">$${mant.costo}</td>
                            <td class="text-center">
                                ${btnFinalizar}
                                <button class="btn btn-outline-dark btn-sm rounded-circle shadow-sm" onclick="eliminarMantenimiento(${mant.idMantenimiento})" title="Eliminar registro">
                                    <i class="fa-solid fa-trash"></i>
                                </button>
                            </td>
                        </tr>
                    `;
                });
            } catch (error) {
                console.error('Error:', error);
            }
        }

        async function cargarVehiculos() {
            try {
                const response = await fetch(API_VEHICULOS);
                const vehiculos = await response.json();
                const select = document.getElementById('vehiculoSelect');
                select.innerHTML = '<option value="">Seleccione un vehículo...</option>';
                
                // Mostrar vehículos, excluyendo los que están actualmente alquilados
                vehiculos.filter(v => v.estado !== 'Alquilado').forEach(v => {
                    select.innerHTML += `<option value="${v.idVehiculo}">${v.marca} ${v.modelo} (Matrícula: ${v.matricula}) - Estado: ${v.estado}</option>`;
                });
            } catch (error) {
                console.error("Error al cargar vehículos", error);
            }
        }

        document.getElementById('formMantenimiento').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // 1. Obtener valores del formulario
            const idVehiculoSel = document.getElementById('vehiculoSelect').value;
            const fechaSel = document.getElementById('fecha').value;
            const descSel = document.getElementById('descripcion').value;
            const costoSel = document.getElementById('costo').value;
            const kmSel = document.getElementById('kilometraje').value;

            // 2. Validar que no haya campos vacíos
            if (!idVehiculoSel || !fechaSel || !descSel || !costoSel || !kmSel) {
                Swal.fire('Atención', 'Todos los campos son obligatorios.', 'warning');
                return;
            }

            // 3. Estructurar el JSON exactamente como lo pide Spring Boot
            const nuevoMantenimiento = {
                vehiculo: { idVehiculo: parseInt(idVehiculoSel) }, // <- Aquí está la corrección
                fechaMantenimiento: fechaSel,
                descripcion: descSel,
                costo: parseFloat(costoSel),
                kilometraje: parseInt(kmSel)
            };

            try {
                // Asegúrate de que API_MANTENIMIENTOS apunte a '/api/mantenimientos'
                const response = await fetch(API_MANTENIMIENTOS, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(nuevoMantenimiento)
                });

                if (response.ok) {
                    const modalEl = document.getElementById('modalMantenimiento');
                    const modalInst = bootstrap.Modal.getInstance(modalEl) || new bootstrap.Modal(modalEl);
                    modalInst.hide();
                    
                    document.getElementById('formMantenimiento').reset();
                    cargarMantenimientos();
                    
                    Swal.fire({ 
                        icon: 'success', 
                        title: '¡En Taller!', 
                        text: 'El mantenimiento se ha registrado correctamente.',
                        timer: 2000, 
                        showConfirmButton: false 
                    });
                } else {
                    const errorData = await response.json();
                    let mensajeError = errorData.error || "Revisa los datos del formulario.";
                    Swal.fire('Error', mensajeError, 'error');
                }
            } catch (error) {
                console.error("Error:", error);
                Swal.fire('Error', 'Problema de conexión con el servidor.', 'error');
            }
        });

        async function eliminarMantenimiento(id) {
            Swal.fire({
                title: '¿Estás seguro?',
                text: "Se borrará este registro del historial.",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#d33',
                cancelButtonColor: '#3085d6',
                confirmButtonText: 'Sí, borrar',
                cancelButtonText: 'Cancelar'
            }).then(async (result) => {
                if (result.isConfirmed) {
                    try {
                        const response = await fetch(`${API_MANTENIMIENTOS}/${id}`, { method: 'DELETE' });
                        if (response.ok) {
                            cargarMantenimientos();
                            Swal.fire('¡Eliminado!', 'El registro ha sido borrado.', 'success');
                        } else {
                            Swal.fire('Error', 'No se pudo eliminar el registro.', 'error');
                        }
                    } catch (error) {
                        console.error('Error:', error);
                    }
                }
            });
        }

        async function finalizarMantenimiento(id) {
            Swal.fire({
                title: '¿Mantenimiento terminado?',
                text: "El vehículo volverá a estar Disponible en la flota.",
                icon: 'question',
                showCancelButton: true,
                confirmButtonColor: '#28a745',
                cancelButtonColor: '#6c757d',
                confirmButtonText: 'Sí, liberar vehículo'
            }).then(async (result) => {
                if (result.isConfirmed) {
                    try {
                        const response = await fetch(`${API_MANTENIMIENTOS}/${id}/finalizar`, { method: 'POST' });
                        if (response.ok) {
                            cargarMantenimientos();
                            Swal.fire('¡Listo!', 'El vehículo ya está disponible para alquilar.', 'success');
                        } else {
                            Swal.fire('Error', 'No se pudo actualizar el estado.', 'error');
                        }
                    } catch (error) {
                        console.error('Error:', error);
                    }
                }
            });
        }


        // Función para filtrar cualquier tabla de la página
        function filtrarTabla() {
            let input = document.getElementById("inputBusqueda");
            let filter = input.value.toLowerCase();
            // Selecciona el cuerpo de la tabla (asegúrate de que sea el único tbody o cámbialo por el ID específico)
            let tbody = document.querySelector("table tbody"); 
            let tr = tbody.getElementsByTagName("tr");

            for (let i = 0; i < tr.length; i++) {
                // Evitamos filtrar la fila de "No hay datos registrados"
                if (tr[i].getElementsByTagName("td").length > 1) {
                    let textValue = tr[i].textContent || tr[i].innerText;
                    if (textValue.toLowerCase().indexOf(filter) > -1) {
                        tr[i].style.display = "";
                    } else {
                        tr[i].style.display = "none";
                    }
                }
            }
        }

    </script>
</body>
</html>
