<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlquilaYA - Sucursales y Oficinas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        .navbar-brand { font-weight: bold; letter-spacing: 1px; }
        .text-orange { color: #ff6b00; }
        .table-custom th { background-color: #6f42c1; color: white; }
    </style>
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm">
        <div class="container-fluid px-4">
            <a class="navbar-brand" href="/"><span class="text-orange">Alquila</span>YA <i class="fa-solid fa-car-side"></i></a>
            <div class="d-flex">
                <a href="/" class="btn btn-outline-light btn-sm"><i class="fa-solid fa-arrow-left"></i> Volver al Panel</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4 mb-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold text-dark"><i class="fa-solid fa-building text-purple" style="color: #6f42c1;"></i> Oficinas Registradas</h2>
            <button class="btn shadow-sm text-white" style="background-color: #6f42c1;" data-bs-toggle="modal" data-bs-target="#modalOficina">
                <i class="fa-solid fa-plus"></i> Nueva Oficina
            </button>
        </div>

        <!-- Barra de búsqueda -->
        <div class="row mb-3">
            <div class="col-md-4 ms-auto">
                <div class="input-group shadow-sm">
                    <span class="input-group-text bg-white border-end-0"><i class="fa-solid fa-magnifying-glass text-muted"></i></span>
                    <input type="text" id="inputBusqueda" class="form-control border-start-0" placeholder="Buscar registro..." onkeyup="filtrarTabla()">
                </div>
            </div>
        </div>

        <div class="card shadow-sm border-0">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0 table-custom">
                        <thead>
                            <tr>
                                <th class="py-3 px-4">ID</th>
                                <th class="py-3">Nombre Sucursal</th>
                                <th class="py-3">Dirección</th>
                                <th class="py-3 text-center">Ciudad / Región</th>
                                <th class="py-3 text-center">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tablaOficinas"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Oficina -->
    <div class="modal fade" id="modalOficina" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow">
                <div class="modal-header bg-dark text-white">
                    <h5 class="modal-title fw-bold"><i class="fa-solid fa-building"></i> Registrar Oficina</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4">
                    <form id="formOficina">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Nombre de la Oficina</label>
                            <input type="text" id="nombreOficina" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Dirección</label>
                            <input type="text" id="direccion" class="form-control" required>
                        </div>
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Ciudad</label>
                                <input type="text" id="ciudad" class="form-control" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Región/Estado</label>
                                <input type="text" id="region" class="form-control" required>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer bg-light">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" form="formOficina" class="btn text-white" style="background-color: #6f42c1;"><i class="fa-solid fa-save"></i> Guardar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API_OFICINAS = '/api/oficinas';
        const modalOficina = new bootstrap.Modal(document.getElementById('modalOficina'));

        document.addEventListener('DOMContentLoaded', cargarOficinas);

        async function cargarOficinas() {
            try {
                const res = await fetch(API_OFICINAS);
                const oficinas = await res.json();
                const tbody = document.getElementById('tablaOficinas');
                tbody.innerHTML = '';

                if(oficinas.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="5" class="text-center py-4 text-muted">No hay oficinas registradas.</td></tr>`;
                    return;
                }

                oficinas.forEach(oficina => {
                    tbody.innerHTML += `
                        <tr>
                            <td class="px-4 fw-bold text-secondary">#${oficina.idOficina}</td>
                            <td class="fw-bold">${oficina.nombreOficina}</td>
                            <td><i class="fa-solid fa-location-dot text-muted"></i> ${oficina.direccion}</td>
                            <td class="text-center"><span class="badge bg-secondary">${oficina.ciudad}</span> <small>${oficina.region}</small></td>
                            <td class="text-center">
                                <button class="btn btn-outline-danger btn-sm rounded-circle shadow-sm" onclick="eliminarOficina(${oficina.idOficina})"><i class="fa-solid fa-trash"></i></button>
                            </td>
                        </tr>
                    `;
                });
            } catch (error) { console.error('Error:', error); }
        }

        document.getElementById('formOficina').addEventListener('submit', async (e) => {
            e.preventDefault();
            const nuevaOficina = {
                nombreOficina: document.getElementById('nombreOficina').value,
                direccion: document.getElementById('direccion').value,
                ciudad: document.getElementById('ciudad').value,
                region: document.getElementById('region').value
            };
            try {
                const response = await fetch(API_OFICINAS, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(nuevaOficina) });
                if (response.ok) {
                    modalOficina.hide(); document.getElementById('formOficina').reset(); cargarOficinas();
                    Swal.fire({ icon: 'success', title: '¡Guardada!', text: 'La oficina se ha registrado.', timer: 2000, showConfirmButton: false });
                }
            } catch (error) { Swal.fire('Error', 'Problema de conexión.', 'error'); }
        });

        async function eliminarOficina(id) {
            Swal.fire({ title: '¿Eliminar oficina?', icon: 'warning', showCancelButton: true, confirmButtonColor: '#d33', confirmButtonText: 'Sí, eliminar' }).then(async (result) => {
                if (result.isConfirmed) {
                    const res = await fetch(`${API_OFICINAS}/${id}`, { method: 'DELETE' });
                    if (res.ok) { cargarOficinas(); Swal.fire('¡Eliminado!', 'Sucursal borrada.', 'success'); }
                    else { Swal.fire('Error', 'No se pudo eliminar (puede tener vehículos asignados).', 'error'); }
                }
            });
        }

        // Función para filtrar cualquier tabla de la página
        function filtrarTabla() {
            let input = document.getElementById("inputBusqueda");
            let filter = input.value.toLowerCase();
            // Selecciona el cuerpo de la tabla (asegúrate de que sea el único tbody o cámbialo por el ID específico)
            let tbody = document.querySelector("table tbody"); 
            let tr = tbody.getElementsByTagName("tr");

            for (let i = 0; i < tr.length; i++) {
                // Evitamos filtrar la fila de "No hay datos registrados"
                if (tr[i].getElementsByTagName("td").length > 1) {
                    let textValue = tr[i].textContent || tr[i].innerText;
                    if (textValue.toLowerCase().indexOf(filter) > -1) {
                        tr[i].style.display = "";
                    } else {
                        tr[i].style.display = "none";
                    }
                }
            }
        }
    </script>
</body>
</html>
